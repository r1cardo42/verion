<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Tierlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Dark Theme (Default) */
    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #27272a;
    --border: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-text: #ffffff;
    --link: #60a5fa;
    --danger: #ef4444;
    --pending: #f59e0b;
    --input-bg: #18181b;
    --glass-bg: rgba(24, 24, 27, 0.75);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  
  html[data-theme="light"] {
    --bg: #F8F9FA;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --border: #E5E7EB;
    --text: #111827;
    --text-muted: #6B7280;
    --accent: #0052FF;
    --accent-hover: #0043D1;
    --accent-text: #FFFFFF;
    --link: #0052FF;
    --danger: #EF4444;
    --pending: #F59E0B;
    --input-bg: #FFFFFF;
    --glass-bg: rgba(255, 255, 255, 0.85);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
    --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 12px 32px rgba(0, 82, 255, 0.08);
  }
  
  html[data-theme="purple"] {
    --bg: #120c1a;
    --surface: #1c1330;
    --surface-2: #291d47;
    --border: #4c3875;
    --text: #f0eaff;
    --text-muted: #b3a3d9;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-text: #ffffff;
    --link: #a78bfa;
    --danger: #f43f5e;
    --pending: #fbbf24;
    --input-bg: #1c1330;
    --glass-bg: rgba(28, 19, 48, 0.8);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 1280px;
    width: 96%;
    margin: 0 auto;
    padding: 0 16px 60px;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  
  h1 { font-size: 32px; margin-bottom: 0; font-weight: 700; letter-spacing: -0.02em; }
  .sub { font-size: 15px; color: var(--text-muted); margin-top: 4px; }

  /* --- Glassmorphism Admin Bar --- */
  #admin-bar {
    position: sticky;
    top: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    font-size: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    z-index: 50;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    border-radius: 0 0 20px 20px;
    margin-left: -16px;
    margin-right: -16px;
  }
  
  #admin-bar input {
    padding: 8px 16px;
    background: var(--surface-2);
    border: 1px solid transparent;
    color: var(--text);
    border-radius: 99px;
    transition: all 0.2s;
    outline: none;
  }
  
  #admin-bar input:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  
  #admin-bar button {
    padding: 8px 16px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
  }
  
  #admin-bar button:hover { background: var(--surface-2); }
  #admin-bar .primary-btn { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  #admin-bar .primary-btn:hover { background: var(--accent-hover); }

  .theme-switch { display: flex; gap: 6px; margin-left: auto; }
  .theme-switch button {
    padding: 6px 14px; font-size: 13px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); cursor: pointer;
    transition: all 0.2s;
  }
  .theme-switch button:hover { color: var(--text); border-color: var(--text-muted); }
  .theme-switch button.active { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }

  /* --- Premium Pills Navigation --- */
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 24px 0 32px; }
  .tabs button {
    padding: 10px 22px; cursor: pointer; background: var(--surface); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 99px; font-size: 15px; font-weight: 500;
    transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  .tabs button:hover { color: var(--text); border-color: var(--text-muted); transform: translateY(-1px); }
  .tabs button.active { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }

  .tab-content { display: none; animation: fadeIn 0.3s ease; }
  .tab-content.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- Hero & Stats --- */
  .hero { text-align: center; padding: 40px 0 60px; }
  .hero h1 { font-size: 48px; letter-spacing: -0.03em; margin-bottom: 16px; }
  .hero p { font-size: 18px; color: var(--text-muted); max-width: 600px; margin: 0 auto; line-height: 1.6; }
  
  .stats { display: flex; justify-content: center; gap: 24px; margin: 40px 0; flex-wrap: wrap; }
  .stat-item { 
    background: var(--surface); padding: 24px 32px; border-radius: 24px; 
    border: 1px solid var(--border); min-width: 160px; text-align: center;
    box-shadow: var(--shadow-md); transition: transform 0.3s;
  }
  .stat-item:hover { transform: translateY(-4px); }
  .stat-item .number { font-size: 42px; font-weight: 700; color: var(--accent); display: block; line-height: 1; margin-bottom: 8px; }
  .stat-item .label { font-size: 15px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  
  .hero-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
  .hero-actions .btn {
    display: inline-flex; align-items: center; justify-content: center; padding: 14px 32px; 
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 99px; color: var(--text); text-decoration: none; font-size: 16px; font-weight: 500; 
    cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  .hero-actions .btn:hover { transform: translateY(-2px); border-color: var(--text-muted); }
  .hero-actions .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .hero-actions .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .social-links { margin-top: 40px; display: flex; gap: 24px; justify-content: center; font-size: 15px; font-weight: 500; }
  .social-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .social-links a:hover { color: var(--text); }

  /* --- Cards Grid --- */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 24px; }
  .card { 
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; 
    padding: 24px; cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-md);
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: var(--shadow-lg); }
  .card .tier { 
    background: var(--text); color: var(--bg); padding: 4px 12px; border-radius: 8px;
    font-weight: 700; font-size: 14px; display: inline-block; margin-bottom: 12px; align-self: flex-start;
  }
  .card .name { font-size: 20px; font-weight: 600; margin-bottom: 12px; line-height: 1.3; }
  .card .detail { font-size: 14px; color: var(--text-muted); margin-top: 8px; display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 8px; }
  .card .detail a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .card .detail a:hover { text-decoration: underline; }

  /* --- List View Table --- */
  .table-wrap { overflow-x: auto; margin-top: 24px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-md); }
  .table-wrap table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table-wrap th { background: var(--surface-2); font-weight: 600; color: var(--text-muted); padding: 16px 20px; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  .table-wrap td { padding: 16px 20px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .table-wrap tbody tr:last-child td { border-bottom: none; }
  .table-wrap td a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .table-wrap td a:hover { text-decoration: underline; }
  .table-wrap tbody tr { transition: background 0.2s; cursor: pointer; }
  .table-wrap tbody tr:hover { background: var(--surface-2); }

  /* --- Proposals --- */
  .proposal-item { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-md); transition: border-color 0.2s; }
  .proposal-item:hover { border-color: var(--accent); }
  .proposal-header { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .proposal-header .title { font-weight: 600; font-size: 18px; }
  .proposal-header .meta { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
  
  .proposal-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; font-size: 14px; margin: 16px 0; background: var(--surface-2); padding: 16px; border-radius: 12px; }
  .proposal-fields .field { display: flex; flex-direction: column; gap: 4px; }
  .proposal-fields .field .label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .proposal-fields .field .value { color: var(--text); font-weight: 500; }
  
  .proposal-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .proposal-actions button { padding: 8px 16px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
  .proposal-actions button:hover { background: var(--surface); border-color: var(--text); }
  .proposal-actions .delete-btn { border-color: transparent; color: var(--danger); background: rgba(239, 68, 68, 0.1); }
  .proposal-actions .delete-btn:hover { background: var(--danger); color: #fff; }
  
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .status-badge.pending { background: var(--pending); color: #fff; }
  .status-badge.approved { background: var(--accent); color: var(--accent-text); }
  .status-badge.rejected { background: var(--danger); color: #fff; }

  .comments { margin-top: 16px; }
  .comment { font-size: 14px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; background: rgba(0,0,0,0.02); border-radius: 8px; padding: 12px; }
  .comment b { font-weight: 600; color: var(--text); }

  /* --- Forms --- */
  form { background: var(--surface); padding: 32px; border-radius: 24px; margin-bottom: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-md); max-width: 900px; }
  form label { display: block; margin-top: 16px; font-size: 14px; font-weight: 500; color: var(--text); }
  form input, form textarea, form select {
    width: 100%; padding: 12px 16px; margin-top: 8px; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 15px; transition: all 0.2s;
  }
  form input:focus, form textarea:focus, form select:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); outline: none; }
  form button[type="submit"], form button[type="button"] { margin-top: 24px; padding: 14px 28px; border: none; border-radius: 99px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; }
  form button[type="submit"] { background: var(--accent); color: var(--accent-text); }
  form button[type="submit"]:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
  
  .small { font-size: 13px; color: var(--text-muted); }
  .flex { display: flex; gap: 20px; flex-wrap: wrap; }
  .flex label { flex: 1; min-width: 220px; }

  .view-toggle { display: flex; gap: 4px; background: var(--surface-2); border-radius: 99px; padding: 4px; border: 1px solid var(--border); }
  .view-toggle button { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; border-radius: 99px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
  .view-toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  /* ===== Modals ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 100; align-items: center; justify-content: center; padding: 40px 16px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    max-width: 640px; width: 100%; padding: 40px; position: relative; box-shadow: var(--shadow-lg);
  }
  .modal-close {
    position: absolute; top: 24px; right: 24px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface-2); border: none; color: var(--text-muted);
    cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .modal-close:hover { background: var(--border); color: var(--text); }
  
  .detail-header { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; }
  .detail-badge {
    width: 64px; height: 64px; border-radius: 16px; background: var(--text); color: var(--bg);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; flex-shrink: 0;
  }
  .detail-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .detail-subtitle { font-size: 15px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
  .detail-price { font-size: 28px; font-weight: 700; color: var(--accent); margin-left: auto; white-space: nowrap; }
  
  .detail-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; margin: 32px 0; padding: 24px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .detail-stat .label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; font-weight: 600; margin-bottom: 4px; }
  .detail-stat .value { font-size: 16px; font-weight: 500; color: var(--text); }
  
  .detail-desc { font-size: 15px; line-height: 1.6; color: var(--text); background: var(--surface-2); padding: 16px; border-radius: 12px; }
  .detail-pitfalls { font-size: 14px; color: var(--danger); margin-top: 16px; line-height: 1.6; background: rgba(239, 68, 68, 0.1); padding: 16px; border-radius: 12px; border-left: 4px solid var(--danger); font-weight: 500; }
  .detail-buy { display: flex; align-items: center; justify-content: center; margin: 32px 0 16px; padding: 16px; background: var(--accent); color: var(--accent-text); border-radius: 16px; text-decoration: none; font-weight: 600; font-size: 16px; transition: all 0.2s; }
  .detail-buy:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
  
  .reviews-title { font-size: 20px; font-weight: 700; margin: 32px 0 16px; border-top: 1px solid var(--border); padding-top: 32px; }
  .review-form { background: var(--surface-2); border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
  .star-input { display: flex; gap: 4px; font-size: 28px; cursor: pointer; margin-bottom: 12px; }
  .star-input span { color: var(--border); transition: color 0.2s; }
  .star-input span.filled { color: var(--pending); }
  .star-input span:hover { transform: scale(1.1); }
  .review-item { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; font-size: 14px; line-height: 1.6; }
  .review-item:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .review-item .stars { color: var(--pending); font-size: 16px; margin-bottom: 8px; letter-spacing: 2px; }

  @media (max-width: 768px) {
    .stats { gap: 16px; }
    .stat-item { min-width: calc(50% - 16px); padding: 16px; }
    .hero h1 { font-size: 36px; }
    .detail-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .detail-price { margin-left: 0; }
    .proposal-fields { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="admin-bar"></div>

<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;">
  <div>
    <h1>GD Tierlist</h1>
    <p class="sub">Клавиатуры и свитчи — рейтинг сообщества</p>
  </div>
  <div class="view-toggle" id="view-toggle" style="margin:8px 0;">
    <button id="view-grid" class="active" onclick="setView('grid')">Плитка</button>
    <button id="view-list" onclick="setView('list')">Список</button>
  </div>
</div>

<div class="tabs">
  <button id="tab-btn-home" class="active" onclick="showTab('home')">Главная</button>
  <button id="tab-btn-keyboards" onclick="showTab('keyboards')">Клавиатуры</button>
  <button id="tab-btn-switches" onclick="showTab('switches')">Свитчи</button>
  <button id="tab-btn-proposals" onclick="showTab('proposals')">Предложения</button>
  <button id="tab-btn-new" onclick="showTab('new')">Предложить</button>
</div>

<!-- ГЛАВНАЯ -->
<div id="tab-home" class="tab-content active">
  <div class="hero">
    <h1>GD Tierlist</h1>
    <p>Самый полный и актуальный рейтинг клавиатур и свитчей для Geometry Dash, поддерживаемый сообществом.</p>
    <div class="stats" id="stats-container">
      <div class="stat-item"><span class="number" id="stat-keyboards">—</span><span class="label">Клавиатур</span></div>
      <div class="stat-item"><span class="number" id="stat-switches">—</span><span class="label">Свитчей</span></div>
      <div class="stat-item"><span class="number" id="stat-proposals">—</span><span class="label">Предложений</span></div>
    </div>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="showTab('keyboards')">Список клавиатур</button>
      <button class="btn btn-primary" onclick="showTab('switches')">Список свитчей</button>
      <button class="btn" onclick="showTab('new')">Предложить изменение</button>
    </div>
    <div class="social-links">
      <a href="#" target="_blank">Discord</a>
      <a href="#" target="_blank">Telegram</a>
      <a href="#" target="_blank">GitHub</a>
    </div>
  </div>
</div>

<!-- КЛАВИАТУРЫ -->
<div id="tab-keyboards" class="tab-content">
  <div id="keyboards-container"><p class="small">Загрузка...</p></div>
</div>

<!-- СВИТЧИ -->
<div id="tab-switches" class="tab-content">
  <div id="switches-container"><p class="small">Загрузка...</p></div>
</div>

<!-- ПРЕДЛОЖЕНИЯ -->
<div id="tab-proposals" class="tab-content">
  <div id="proposals-list"><p class="small">Загрузка...</p></div>
</div>

<!-- ПРЕДЛОЖИТЬ -->
<div id="tab-new" class="tab-content">
  <div class="tabs" style="margin-bottom:16px;">
    <button id="new-subtab-btn-keyboard" class="active" onclick="showNewSubtab('keyboard')">Клавиатура</button>
    <button id="new-subtab-btn-switch" onclick="showNewSubtab('switch')">Свитч</button>
  </div>

  <form id="proposal-form-keyboard">
    <label>Тип предложения
      <select id="kb-type">
        <option value="add">Добавить новую клавиатуру</option>
        <option value="edit">Изменить существующую</option>
      </select>
    </label>
    <div id="kb-edit-target-wrap" style="display:none">
      <label>Какую клавиатуру меняем <select id="kb-target"></select></label>
    </div>
    <div id="kb-name-wrap" class="flex">
      <label>Название <input id="kb-name"></label>
    </div>
    <div class="flex">
      <div id="kb-format-wrap" style="flex:1; min-width:140px;">
        <label>Формат <input id="kb-format" placeholder="60%, 65%, TKL..."></label>
      </div>
      <label>Тир <input id="kb-tier" placeholder="SS+, SS, S+, ..."></label>
    </div>
    <div class="flex">
      <label>Цена <input id="kb-price"></label>
      <label>Где купить (ссылка) <input id="kb-buy" placeholder="https://..."></label>
    </div>
    <div class="flex">
      <label>Свитчи <input id="kb-switches"></label>
      <label>Софт <input id="kb-software"></label>
    </div>
    <div class="flex">
      <label>Разработчик/чип <input id="kb-dev"></label>
      <label>Рекомендация <input id="kb-recommend" placeholder="напр. высокая"></label>
    </div>
    <label>Тестеры <input id="kb-testers"></label>
    <label>Подводные камни <textarea id="kb-pitfalls" rows="2"></textarea></label>
    <label>Почему стоит внести это изменение <textarea id="kb-reason" rows="2"></textarea></label>
    <div class="flex">
      <label>Ваш ник <input id="kb-author" placeholder="как вас подписать"></label>

    <div class="flex">
      <button type="submit">Отправить на рассмотрение</button>
      <button type="button" onclick="resetForm('keyboard')" style="background:var(--surface-2); color:var(--text); border:1px solid var(--border);">Сбросить всё</button>
    </div>
  </form>

  <form id="proposal-form-switch" style="display:none">
    <label>Тип предложения
      <select id="sw-type">
        <option value="add">Добавить новый свитч</option>
        <option value="edit">Изменить существующий</option>
      </select>
    </label>
    <div id="sw-edit-target-wrap" style="display:none">
      <label>Какой свитч меняем <select id="sw-target"></select></label>
    </div>
    <div id="sw-name-wrap" class="flex">
      <label>Название <input id="sw-name"></label>
    </div>
    <div class="flex">
      <label>Тир <input id="sw-tier" placeholder="SS+, SS, S+, ..."></label>
      <label>Цена <input id="sw-price"></label>
    </div>
    <div class="flex">
      <label>Где купить (ссылка) <input id="sw-buy" placeholder="https://..."></label>
      <label>Ход свитча <input id="sw-travel" placeholder="3.5"></label>
    </div>
    <div class="flex">
      <label>Сила нажатия <input id="sw-force" placeholder="35г"></label>
      <label>Stem <input id="sw-stem" placeholder="POM"></label>
    </div>
    <div class="flex">
      <label>Top housing <input id="sw-top" placeholder="PC"></label>
      <label>Bottom housing <input id="sw-bottom" placeholder="PA66"></label>
    </div>
    <div class="flex">
      <label>Рекомендация <input id="sw-recommend" placeholder="напр. высокая"></label>
      <label>Тестеры <input id="sw-testers"></label>
    </div>
    <label>Примечание <textarea id="sw-note" rows="2"></textarea></label>
    <label>Подводные камни <textarea id="sw-pitfalls" rows="2"></textarea></label>
    <label>Почему стоит внести это изменение <textarea id="sw-reason" rows="2"></textarea></label>
    <div class="flex">
      <label>Ваш ник <input id="sw-author" placeholder="как вас подписать"></label>
    </div>
    <div class="flex">
      <button type="submit">Отправить на рассмотрение</button>
      <button type="button" onclick="resetForm('switch')" style="background:var(--surface-2); color:var(--text); border:1px solid var(--border);">Сбросить всё</button>
    </div>
  </form>
</div>

<!-- ===== МОДАЛКА: ПОДРОБНЕЕ ===== -->
<div id="detail-modal" class="modal-overlay" onclick="if(event.target===this) closeDetailModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    <div id="detail-modal-content">Загрузка...</div>
  </div>
</div>

<!-- ===== МОДАЛКА: РЕГИСТРАЦИЯ ===== -->
<div id="signup-modal" class="modal-overlay" onclick="if(event.target===this) closeSignupModal()">
  <div class="modal-box" style="max-width:380px;">
    <button class="modal-close" onclick="closeSignupModal()">&times;</button>
    <h2 style="margin-top:0; font-size:24px; font-weight:700; margin-bottom:24px;">Регистрация</h2>
    <label style="display:block; font-size:14px; font-weight:500; color:var(--text); margin-top:16px;">Ник
      <input id="signup-nick" style="width:100%; padding:12px 16px; margin-top:8px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); border-radius:12px; outline:none; transition:all 0.2s;">
    </label>
    <label style="display:block; font-size:14px; font-weight:500; color:var(--text); margin-top:16px;">Email
      <input id="signup-email" type="email" style="width:100%; padding:12px 16px; margin-top:8px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); border-radius:12px; outline:none; transition:all 0.2s;">
    </label>
    <label style="display:block; font-size:14px; font-weight:500; color:var(--text); margin-top:16px;">Пароль
      <input id="signup-pass" type="password" style="width:100%; padding:12px 16px; margin-top:8px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); border-radius:12px; outline:none; transition:all 0.2s;">
    </label>
    <button onclick="doSignUp()" style="width:100%; margin-top:24px; padding:14px; background:var(--accent); color:var(--accent-text); border:none; border-radius:99px; font-weight:600; cursor:pointer; font-size:15px; transition:all 0.2s;">Зарегистрироваться</button>
    <div style="text-align:center; font-size:13px; font-weight:500; color:var(--text-muted); margin:20px 0;">или</div>
    <button onclick="loginGoogle()" style="width:100%; padding:14px; background:#4285F4; color:#fff; border:none; border-radius:99px; font-weight:600; cursor:pointer; font-size:15px; transition:all 0.2s;">Продолжить с Google</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentView = localStorage.getItem('tierlist_view') || 'grid';
let currentUser = null;
let isAdmin = false;
let allKeyboards = [];
let allSwitches = [];
let selectedRating = 0;

// ============================================================
//  ТЕМЫ
// ============================================================
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('tierlist_theme', theme);
  document.querySelectorAll('.theme-switch button').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
}
(function initTheme() {
  const saved = localStorage.getItem('tierlist_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
})();

// ============================================================
//  УТИЛИТЫ
// ============================================================
function getVoterId() {
  let id = localStorage.getItem('voter_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('voter_id', id); }
  return id;
}

function linkify(text) {
  if (!text) return '';
  return text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
}

const KNOWN_LINKS = {
  'ozon': 'https://www.ozon.ru',
  'aliexpress': 'https://aliexpress.com',
  'taobao': 'https://www.taobao.com',
  'bilibili': 'https://www.bilibili.com',
  'goofish': 'https://www.goofish.com',
  'авито': 'https://www.avito.ru',
  'avito': 'https://www.avito.ru',
  'dns': 'https://www.dns-shop.ru',
  'vgn hub': 'https://vgn.gg',
  'wootility': 'https://wootility.io',
  'atk': 'https://www.atkgear.com',
  'mchose hub': 'https://mchose.com',
  'aula hub': 'https://www.aulacn.com',
  'chilkey hub': 'https://chilkey.com',
};

function autoLink(text) {
  if (!text) return '';
  if (/https?:\/\//.test(text)) return linkify(text);
  const key = text.trim().toLowerCase();
  if (KNOWN_LINKS[key]) return `<a href="${KNOWN_LINKS[key]}" target="_blank">${text}</a>`;
  return text;
}

// Красивое имя магазина из ссылки, для кнопки "Купить на ..."
function siteLabel(url) {
  if (!url) return null;
  try {
    const host = new URL(url).hostname.replace('www.', '');
    const known = { 'ozon.ru': 'Ozon', 'aliexpress.com': 'AliExpress', 'avito.ru': 'Avito', 'dns-shop.ru': 'DNS', 'taobao.com': 'Taobao' };
    if (known[host]) return known[host];
    return host;
  } catch (e) {
    // не полноценная ссылка — возможно просто название магазина
    const key = url.trim().toLowerCase();
    if (KNOWN_LINKS[key]) return url.trim();
    return null;
  }
}
function resolveBuyUrl(text) {
  if (!text) return null;
  if (/^https?:\/\//.test(text)) return text;
  const key = text.trim().toLowerCase();
  return KNOWN_LINKS[key] || null;
}

function resetForm(cat) {
  const formId = cat === 'switch' ? 'proposal-form-switch' : 'proposal-form-keyboard';
  const wrapId = cat === 'switch' ? 'sw-edit-target-wrap' : 'kb-edit-target-wrap';
  document.getElementById(formId).reset();
  document.getElementById(wrapId).style.display = 'none';
  if (cat === 'keyboard') { document.getElementById('kb-type').value = 'add'; document.getElementById('kb-type').dispatchEvent(new Event('change')); }
  else { document.getElementById('sw-type').value = 'add'; document.getElementById('sw-type').dispatchEvent(new Event('change')); }
}

function setView(view) {
  currentView = view;
  localStorage.setItem('tierlist_view', view);
  document.getElementById('view-grid').classList.toggle('active', view === 'grid');
  document.getElementById('view-list').classList.toggle('active', view === 'list');
  if (document.getElementById('tab-keyboards').classList.contains('active')) renderKeyboards();
  if (document.getElementById('tab-switches').classList.contains('active')) renderSwitches();
}

// ============================================================
//  ВКЛАДКИ
// ============================================================
function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabs > button').forEach(el => el.classList.remove('active'));
  const tab = document.getElementById('tab-' + name);
  if (tab) tab.classList.add('active');
  const btn = document.getElementById('tab-btn-' + name);
  if (btn) btn.classList.add('active');
  localStorage.setItem('tierlist_tab', name);

  if (name === 'home') loadStats();
  if (name === 'keyboards') loadKeyboards();
  if (name === 'switches') loadSwitches();
  if (name === 'proposals') loadProposals();
  if (name === 'new') showNewSubtab('keyboard');
}

// ============================================================
//  АДМИНКА + АВТОРИЗАЦИЯ
// ============================================================
async function refreshAdminBar() {
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  isAdmin = false;
  if (user) {
    const { data: adminRow } = await sb.from('admins').select('*').eq('user_id', user.id).maybeSingle();
    isAdmin = !!adminRow;
  }
  const bar = document.getElementById('admin-bar');
  let leftHtml;
  if (currentUser) {
    leftHtml = `
      <span>${currentUser.email}${isAdmin ? ' · админ' : ''}</span>
      <button onclick="logout()">Выйти</button>
    `;
  } else {
    leftHtml = `
      <input id="login-email" placeholder="email" type="email" style="width:160px;">
      <input id="login-pass" placeholder="пароль" type="password" style="width:120px;">
      <button onclick="login()" class="primary-btn">Войти</button>
      <button onclick="openSignupModal()">Регистрация</button>
    `;
  }
  bar.innerHTML = leftHtml + `
    <div class="theme-switch">
      <button data-theme="dark" onclick="setTheme('dark')">Dark</button>
      <button data-theme="light" onclick="setTheme('light')">Light</button>
      <button data-theme="purple" onclick="setTheme('purple')">Purple</button>
    </div>
  `;
  const activeTheme = localStorage.getItem('tierlist_theme') || 'dark';
  document.querySelectorAll('.theme-switch button').forEach(b => b.classList.toggle('active', b.dataset.theme === activeTheme));

  if (document.getElementById('tab-proposals').classList.contains('active')) loadProposals();
}

async function login() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-pass').value;
  if (!email || !password) { alert('Введите email и пароль'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) alert('Ошибка: ' + error.message);
  else refreshAdminBar();
}

function openSignupModal() { document.getElementById('signup-modal').classList.add('open'); }
function closeSignupModal() { document.getElementById('signup-modal').classList.remove('open'); }

async function doSignUp() {
  const nickname = document.getElementById('signup-nick').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-pass').value;
  if (!nickname || !email || !password) { alert('Заполните ник, email и пароль'); return; }
  if (password.length < 6) { alert('Пароль должен быть не короче 6 символов'); return; }

  const { data, error } = await sb.auth.signUp({
    email, password,
    options: {
      data: { nickname },
      emailRedirectTo: window.location.origin + window.location.pathname
    }
  });
  if (error) { alert('Ошибка регистрации: ' + error.message); return; }

  closeSignupModal();
  if (data.user && !data.session) {
    alert('Проверьте почту (' + email + ') и подтвердите email по ссылке, затем войдите.');
  } else {
    alert('Аккаунт создан, вы вошли.');
    refreshAdminBar();
  }
}

async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) alert('Ошибка Google: ' + error.message);
}

async function logout() {
  await sb.auth.signOut();
  refreshAdminBar();
}

// ============================================================
//  СТАТИСТИКА
// ============================================================
async function loadStats() {
  try {
    const [{ count: keyboards }, { count: switches }, { count: proposals }] = await Promise.all([
      sb.from('devices').select('*', { count: 'exact', head: true }),
      sb.from('switches').select('*', { count: 'exact', head: true }),
      sb.from('proposals').select('*', { count: 'exact', head: true })
    ]);
    document.getElementById('stat-keyboards').textContent = keyboards || 0;
    document.getElementById('stat-switches').textContent = switches || 0;
    document.getElementById('stat-proposals').textContent = proposals || 0;
  } catch (e) { console.warn('Не удалось загрузить статистику', e); }
}

// ============================================================
//  СОРТИРОВКА ПО ТИРАМ
// ============================================================
const tierOrder = ['SS+', 'SS', 'S+', 'S', 'A+', 'A', 'B', 'C', 'D', 'F'];
function sortByTier(items) {
  return items.sort((a, b) => {
    const getMainTier = (tier) => { if (!tier) return ''; return tier.split(/[\s\-]+/)[0]; };
    const indexA = tierOrder.indexOf(getMainTier(a.tier));
    const indexB = tierOrder.indexOf(getMainTier(b.tier));
    if (indexA === -1 && indexB === -1) return 0;
    if (indexA === -1) return 1;
    if (indexB === -1) return -1;
    return indexA - indexB;
  });
}

// ============================================================
//  РЕНДЕРИНГ: ПЛИТКА
// ============================================================
function renderCardGrid(items, category) {
  if (!items || items.length === 0) return '<p class="small">Нет данных.</p>';
  return `<div class="card-grid">${items.map(d => `
    <div class="card" onclick="openDetailModal('${category}','${d.id}')">
      <div class="tier">${d.tier || '?'}</div>
      <div class="name">${d.name || 'без названия'}</div>
      ${d.format ? `<div class="detail"><span>Формат</span> <span>${d.format}</span></div>` : ''}
      ${d.price ? `<div class="detail"><span>Цена</span> <span style="color:var(--accent);font-weight:600">${d.price}</span></div>` : ''}
      ${d.travel || d.force ? `<div class="detail"><span>Ход/сила</span> <span>${d.travel || ''} ${d.force || ''}</span></div>` : ''}
    </div>
  `).join('')}</div>`;
}

function renderTable(items, category) {
  if (!items || items.length === 0) return '<p class="small">Нет данных.</p>';
  const isSwitch = category === 'switch';
  const headers = isSwitch
    ? ['Тир', 'Название', 'Цена', 'Где купить', 'Ход', 'Сила', 'Stem', 'Top', 'Bottom']
    : ['Тир', 'Название', 'Формат', 'Цена', 'Где купить', 'Свитчи', 'Софт', 'Разработчик'];
  const rows = items.map(d => {
    const buy = d.buy_url || d.buy_link || '';
    const cells = isSwitch
      ? [d.tier, d.name, d.price, autoLink(buy), d.travel, d.force, d.stem, d.top_housing, d.bottom_housing]
      : [d.tier, d.name, d.format, d.price, autoLink(buy), d.switches, autoLink(d.software), d.developer];
    return `<tr onclick="openDetailModal('${category}','${d.id}')">${cells.map((c, i) => i === 0 ? `<td><b>${c || ''}</b></td>` : `<td>${c || ''}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead><tr><th>${headers.join('</th><th>')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderKeyboards() {
  const container = document.getElementById('keyboards-container');
  if (!allKeyboards || allKeyboards.length === 0) { container.innerHTML = `<p class="small">Нет данных. Добавьте клавиатуры через предложения.</p>`; return; }
  container.innerHTML = currentView === 'grid' ? renderCardGrid(allKeyboards, 'keyboard') : renderTable(allKeyboards, 'keyboard');
}
function renderSwitches() {
  const container = document.getElementById('switches-container');
  if (!allSwitches || allSwitches.length === 0) { container.innerHTML = `<p class="small">Нет данных. Добавьте свитчи через предложения.</p>`; return; }
  container.innerHTML = currentView === 'grid' ? renderCardGrid(allSwitches, 'switch') : renderTable(allSwitches, 'switch');
}

async function loadKeyboards() {
  const { data, error } = await sb.from('devices').select('*');
  if (error) { document.getElementById('keyboards-container').innerHTML = `<p class="small">Ошибка: ${error.message}</p>`; return; }
  allKeyboards = sortByTier(data || []);
  renderKeyboards();
}
async function loadSwitches() {
  const { data, error } = await sb.from('switches').select('*');
  if (error) { document.getElementById('switches-container').innerHTML = `<p class="small">Ошибка: ${error.message}</p>`; return; }
  allSwitches = sortByTier(data || []);
  renderSwitches();
}

// ============================================================
//  МОДАЛКА "ПОДРОБНЕЕ"
// ============================================================
let currentDetailItem = null;

async function openDetailModal(category, id) {
  const table = category === 'switch' ? 'switches' : 'devices';
  const { data: item, error } = await sb.from(table).select('*').eq('id', id).single();
  if (error || !item) { alert('Не удалось загрузить: ' + (error ? error.message : '')); return; }
  currentDetailItem = { category, table, item };
  selectedRating = 0;

  const buyUrl = resolveBuyUrl(item.buy_url || item.buy_link);
  const label = siteLabel(item.buy_url || item.buy_link) || 'магазине';

  const statBlocks = category === 'switch'
    ? [ ['Ход', item.travel], ['Сила', item.force], ['Stem / Top / Bottom', [item.stem, item.top_housing, item.bottom_housing].filter(Boolean).join(' / ')] ]
    : [ ['Формат', item.format], ['Свитчи', item.switches], ['Софт', item.software] ];

  const description = item.notes || item.pitfalls_desc || '';

  document.getElementById('detail-modal-content').innerHTML = `
    <div class="detail-header">
      <div class="detail-badge">${(item.tier || '?').slice(0,2)}</div>
      <div>
        <div class="detail-title">${item.name || ''}</div>
        <div class="detail-subtitle">${category === 'switch' ? 'Свитч' : 'Клавиатура'}${item.developer ? ' · ' + item.developer : ''}</div>
      </div>
      ${item.price ? `<div class="detail-price">${item.price}</div>` : ''}
    </div>

    <div class="detail-stats">
      ${statBlocks.filter(s => s[1]).map(s => `<div class="detail-stat"><div class="label">${s[0]}</div><div class="value">${s[1]}</div></div>`).join('')}
    </div>

    ${description ? `<div class="detail-desc">${linkify(description)}</div>` : ''}
    ${item.pitfalls ? `<div class="detail-pitfalls">Подводные камни: ${linkify(item.pitfalls)}</div>` : ''}
    ${item.testers ? `<div class="detail-desc" style="margin-top:16px; color:var(--text-muted); background:transparent; padding:0;">Тестеры: ${linkify(item.testers)}</div>` : ''}

    ${buyUrl ? `<a href="${buyUrl}" target="_blank" class="detail-buy">Купить на ${label}</a>` : ''}

    <div class="reviews-title">Отзывы</div>
    <div class="review-form">
      <div class="star-input" id="star-input">
        ${[1,2,3,4,5].map(n => `<span data-star="${n}" onclick="setRating(${n})">&#9733;</span>`).join('')}
      </div>
      <textarea id="review-text" rows="2" placeholder="Поделитесь опытом использования..." style="width:100%; padding:12px 16px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); border-radius:12px; font-family:inherit; outline:none; transition:all 0.2s;"></textarea>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px;">
        <span class="small">Имя и аккаунт не нужны · публикация после модерации</span>
        <button onclick="submitReview()" style="padding:10px 24px; background:var(--accent); color:var(--accent-text); border:none; border-radius:99px; cursor:pointer; font-weight:600;">Отправить</button>
      </div>
    </div>
    <div id="reviews-list" style="margin-top:24px;">Загрузка отзывов...</div>
  `;

  document.getElementById('detail-modal').classList.add('open');
  loadReviews(table, id);
}

function closeDetailModal() {
  document.getElementById('detail-modal').classList.remove('open');
  currentDetailItem = null;
}

function setRating(n) {
  selectedRating = n;
  document.querySelectorAll('#star-input span').forEach(el => {
    el.classList.toggle('filled', Number(el.dataset.star) <= n);
  });
}

async function loadReviews(table, id) {
  const { data, error } = await sb.from('reviews').select('*').eq('target_table', table).eq('target_id', id).order('created_at', { ascending: false });
  const el = document.getElementById('reviews-list');
  if (error) {
    // таблица reviews может быть ещё не создана
    el.innerHTML = `<p class="small">Отзывы пока недоступны.</p>`;
    return;
  }
  if (!data || data.length === 0) { el.innerHTML = `<p class="small">Пока нет отзывов. Будьте первым.</p>`; return; }
  el.innerHTML = data.map(r => `
    <div class="review-item">
      <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
      ${r.text ? `<div>${linkify(r.text)}</div>` : ''}
    </div>
  `).join('');
}

async function submitReview() {
  if (!currentDetailItem) return;
  if (!selectedRating) { alert('Поставьте оценку звёздами'); return; }
  const text = document.getElementById('review-text').value.trim();
  const { error } = await sb.from('reviews').insert({
    target_table: currentDetailItem.table,
    target_id: currentDetailItem.item.id,
    rating: selectedRating,
    text
  });
  if (error) { alert('Не удалось отправить отзыв: ' + error.message); return; }
  document.getElementById('review-text').value = '';
  selectedRating = 0;
  document.querySelectorAll('#star-input span').forEach(el => el.classList.remove('filled'));
  loadReviews(currentDetailItem.table, currentDetailItem.item.id);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDetailModal(); closeSignupModal(); }
});

// ============================================================
//  ПРЕДЛОЖЕНИЯ (плашки)
// ============================================================
async function loadProposals() {
  const container = document.getElementById('proposals-list');
  const { data: proposals, error } = await sb.from('proposals').select('*').order('created_at', { ascending: false });

  if (error) { container.innerHTML = `<p class="small">Ошибка: ${error.message}</p>`; return; }
  if (!proposals || proposals.length === 0) { container.innerHTML = `<p class="small">Пока нет предложений. Будьте первым.</p>`; return; }

  container.innerHTML = '';
  for (const p of proposals) {
    const [{ data: likes }, { data: comments }] = await Promise.all([
      sb.from('proposal_likes').select('id').eq('proposal_id', p.id),
      sb.from('proposal_comments').select('*').eq('proposal_id', p.id).order('created_at', { ascending: true })
    ]);

    const div = document.createElement('div');
    div.className = 'proposal-item';

    const categoryLabel = p.category === 'switch' ? 'Свитч' : 'Клавиатура';
    const typeLabel = p.type === 'add' ? 'Новое' : 'Изменение';
    const statusLabel = p.status === 'pending' ? 'На рассмотрении' : p.status === 'approved' ? 'Одобрено' : 'Отклонено';

    const payload = p.payload || {};
    const fields = [
      { label: 'Название', value: payload.name },
      { label: 'Тир', value: payload.tier },
      { label: 'Формат', value: payload.format },
      { label: 'Цена', value: payload.price },
      { label: 'Где купить', value: payload.buy_url || payload.buy_link },
      { label: 'Свитчи', value: payload.switches },
      { label: 'Софт', value: payload.software },
      { label: 'Разработчик/чип', value: payload.developer },
      { label: 'Рекомендация', value: payload.recommend },
      { label: 'Ход/сила', value: payload.travel || payload.force ? `${payload.travel || ''} ${payload.force || ''}` : '' },
      { label: 'Стем/верх/низ', value: payload.stem || payload.top_housing || payload.bottom_housing ? [payload.stem, payload.top_housing, payload.bottom_housing].filter(Boolean).join(', ') : '' },
      { label: 'Тестеры', value: payload.testers },
      { label: 'Примечание', value: payload.notes },
      { label: 'Подводные камни', value: payload.pitfalls },
    ].filter(f => f.value);

    let fieldsHtml = fields.map(f => {
      const isLinkableField = f.label === 'Где купить' || f.label === 'Софт';
      const val = isLinkableField ? autoLink(f.value) : linkify(f.value);
      return `<div class="field"><span class="label">${f.label}</span> <span class="value">${val}</span></div>`;
    }).join('');

    div.innerHTML = `
      <div class="proposal-header">
        <span class="title">${categoryLabel} — ${typeLabel}</span>
        <span class="meta">
          от ${p.author_name || 'аноним'} · ${new Date(p.created_at).toLocaleString('ru')}
          <span class="status-badge ${p.status}">${statusLabel}</span>
        </span>
      </div>
      ${p.reason ? `<div style="color:var(--text); font-size:15px; margin-bottom:12px; background:var(--surface-2); padding:12px 16px; border-radius:12px;"><b>Причина:</b> ${p.reason}</div>` : ''}
      <div class="proposal-fields">${fieldsHtml}</div>
      <div class="proposal-actions">
        <button onclick="likeProposal('${p.id}')" style="background:var(--surface-2);">Нравится (${likes ? likes.length : 0})</button>
        <span class="small" style="margin-left:8px;">Комментариев: ${comments ? comments.length : 0}</span>
        ${isAdmin && p.status === 'pending' ? `
          <button onclick="resolveProposal('${p.id}', 'approved')" style="background:var(--accent); color:var(--accent-text); border-color:var(--accent);">Принять</button>
          <button onclick="resolveProposal('${p.id}', 'rejected')">Отклонить</button>
        ` : ''}
        ${isAdmin ? `<button onclick="deleteProposal('${p.id}')" class="delete-btn">Удалить</button>` : ''}
      </div>
      <div class="comments">
        ${(comments || []).map(c => `<div class="comment"><b>${c.author_name || 'аноним'}:</b> ${c.text}</div>`).join('')}
      </div>
      <form onsubmit="return addComment(event, '${p.id}')" style="margin-top:16px; background:transparent; padding:0; border:none; box-shadow:none; max-width:none; display:flex; gap:12px; flex-wrap:wrap;">
        <input placeholder="Ваш ник" class="c-author" style="width:160px; flex-shrink:0; background:var(--input-bg); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:99px; outline:none; transition:border-color 0.2s;">
        <input placeholder="Комментарий" class="c-text" style="flex-grow:1; min-width:200px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:99px; outline:none; transition:border-color 0.2s;" required>
        <button type="submit" style="margin-top:0; padding:10px 24px; border-radius:99px;">Отправить</button>
      </form>
    `;
    container.appendChild(div);
  }
}

async function likeProposal(id) {
  const voter_id = getVoterId();
  const { error } = await sb.from('proposal_likes').insert({ proposal_id: id, voter_id });
  if (error && !error.message.includes('duplicate')) alert(error.message);
  loadProposals();
}

async function addComment(e, proposalId) {
  e.preventDefault();
  const form = e.target;
  const author_name = form.querySelector('.c-author').value;
  const text = form.querySelector('.c-text').value;
  await sb.from('proposal_comments').insert({ proposal_id: proposalId, author_name, text });
  loadProposals();
  return false;
}

async function resolveProposal(id, status) {
  const { data: proposal } = await sb.from('proposals').select('*').eq('id', id).single();
  if (!proposal) return;

  if (status === 'approved') {
    const payload = proposal.payload || {};
    if (proposal.type === 'add') {
      if (proposal.category === 'switch') {
        await sb.from('switches').insert({
          name: payload.name, tier: payload.tier, price: payload.price, buy_url: payload.buy_url,
          recommend: payload.recommend, travel: payload.travel, force: payload.force, stem: payload.stem,
          top_housing: payload.top_housing, bottom_housing: payload.bottom_housing, notes: payload.notes,
          testers: payload.testers, pitfalls: payload.pitfalls
        });
      } else {
        await sb.from('devices').insert({
          name: payload.name, tier: payload.tier, format: payload.format, price: payload.price,
          buy_url: payload.buy_url, switches: payload.switches, software: payload.software,
          developer: payload.developer, pitfalls: payload.pitfalls, testers: payload.testers,
          recommendation: payload.recommend
        });
      }
    } else {
      // редактирование: обновляем только реально присланные поля (пустые name/format не затирают данные)
      const table = proposal.category === 'switch' ? 'switches' : 'devices';
      const targetId = proposal.target_device_id;
      const updateData = { ...payload };
      delete updateData.name;
      if (proposal.category !== 'switch') delete updateData.format;
      if (proposal.category === 'switch') updateData.recommendation = undefined;
      Object.keys(updateData).forEach(k => { if (updateData[k] === undefined || updateData[k] === '') delete updateData[k]; });
      if (targetId && Object.keys(updateData).length > 0) {
        await sb.from(table).update(updateData).eq('id', targetId);
      }
    }
  }

  await sb.from('proposals').update({
    status, resolved_at: new Date().toISOString(), resolved_by: currentUser ? currentUser.email : null
  }).eq('id', id);

  loadKeyboards();
  loadSwitches();
  loadProposals();
}

async function deleteProposal(id) {
  if (!confirm('Удалить это предложение навсегда?')) return;
  const { error } = await sb.from('proposals').delete().eq('id', id);
  if (error) { alert('Ошибка удаления: ' + error.message); return; }
  loadProposals();
}

// ============================================================
//  ФОРМА ПРЕДЛОЖЕНИЯ
// ============================================================
function showNewSubtab(cat) {
  document.getElementById('proposal-form-keyboard').style.display = cat === 'keyboard' ? 'block' : 'none';
  document.getElementById('proposal-form-switch').style.display = cat === 'switch' ? 'block' : 'none';
  document.getElementById('new-subtab-btn-keyboard').classList.toggle('active', cat === 'keyboard');
  document.getElementById('new-subtab-btn-switch').classList.toggle('active', cat === 'switch');
}

async function fillTargetSelect(selectId, table) {
  const select = document.getElementById(selectId);
  const { data, error } = await sb.from(table).select('id, name').order('name');
  if (error) { select.innerHTML = `<option>Ошибка</option>`; return; }
  select.innerHTML = (data || []).map(d => `<option value="${d.id}">${d.name}</option>`).join('');
}

// --- Клавиатура ---
document.getElementById('kb-type').addEventListener('change', e => {
  const isEdit = e.target.value === 'edit';
  document.getElementById('kb-edit-target-wrap').style.display = isEdit ? 'block' : 'none';
  document.getElementById('kb-name-wrap').style.display = isEdit ? 'none' : 'flex';
  document.getElementById('kb-format-wrap').style.display = isEdit ? 'none' : 'block';
  if (isEdit) fillTargetSelect('kb-target', 'devices');
});

document.getElementById('proposal-form-keyboard').addEventListener('submit', async e => {
  e.preventDefault();
  const type = document.getElementById('kb-type').value;
  const target_id = type === 'edit' ? document.getElementById('kb-target').value : null;

  if (type === 'add' && !document.getElementById('kb-name').value.trim()) { alert('Укажите название'); return; }
  if (type === 'edit' && !target_id) { alert('Выберите, какую клавиатуру меняем'); return; }

  const payload = {
    tier: document.getElementById('kb-tier').value,
    price: document.getElementById('kb-price').value,
    buy_url: document.getElementById('kb-buy').value,
    switches: document.getElementById('kb-switches').value,
    software: document.getElementById('kb-software').value,
    developer: document.getElementById('kb-dev').value,
    recommend: document.getElementById('kb-recommend').value,
    testers: document.getElementById('kb-testers').value,
    pitfalls: document.getElementById('kb-pitfalls').value,
  };
  if (type === 'add') {
    payload.name = document.getElementById('kb-name').value;
    payload.format = document.getElementById('kb-format').value;
  }

  const reason = document.getElementById('kb-reason').value;
  const author_name = document.getElementById('kb-author').value;

  const { error } = await sb.from('proposals').insert({
    type, category: 'keyboard', target_device_id: target_id, target_table: 'devices',
    payload, reason, author_name, status: 'pending'
  });

  if (error) { alert('Ошибка: ' + error.message); return; }
  alert('Предложение отправлено!');
  resetForm('keyboard');
  showTab('proposals');
  loadProposals();
});

// --- Свитч ---
document.getElementById('sw-type').addEventListener('change', e => {
  const isEdit = e.target.value === 'edit';
  document.getElementById('sw-edit-target-wrap').style.display = isEdit ? 'block' : 'none';
  document.getElementById('sw-name-wrap').style.display = isEdit ? 'none' : 'flex';
  if (isEdit) fillTargetSelect('sw-target', 'switches');
});

document.getElementById('proposal-form-switch').addEventListener('submit', async e => {
  e.preventDefault();
  const type = document.getElementById('sw-type').value;
  const target_id = type === 'edit' ? document.getElementById('sw-target').value : null;

  if (type === 'add' && !document.getElementById('sw-name').value.trim()) { alert('Укажите название'); return; }
  if (type === 'edit' && !target_id) { alert('Выберите, какой свитч меняем'); return; }

  const payload = {
    price: document.getElementById('sw-price').value,
    buy_url: document.getElementById('sw-buy').value,
    travel: document.getElementById('sw-travel').value,
    force: document.getElementById('sw-force').value,
    stem: document.getElementById('sw-stem').value,
    top_housing: document.getElementById('sw-top').value,
    bottom_housing: document.getElementById('sw-bottom').value,
    recommend: document.getElementById('sw-recommend').value,
    testers: document.getElementById('sw-testers').value,
    notes: document.getElementById('sw-note').value,
    pitfalls: document.getElementById('sw-pitfalls').value,
  };
  if (type === 'add') {
    payload.name = document.getElementById('sw-name').value;
    payload.tier = document.getElementById('sw-tier').value;
  } else {
    payload.tier = document.getElementById('sw-tier').value;
  }

  const reason = document.getElementById('sw-reason').value;
  const author_name = document.getElementById('sw-author').value;

  const { error } = await sb.from('proposals').insert({
    type, category: 'switch', target_device_id: target_id, target_table: 'switches',
    payload, reason, author_name, status: 'pending'
  });

  if (error) { alert('Ошибка: ' + error.message); return; }
  alert('Предложение отправлено!');
  resetForm('switch');
  showTab('proposals');
  loadProposals();
});

// ============================================================
//  ИНИЦИАЛИЗАЦИЯ
// ============================================================
document.getElementById('view-grid').classList.toggle('active', currentView === 'grid');
document.getElementById('view-list').classList.toggle('active', currentView === 'list');

refreshAdminBar();
loadStats();
loadKeyboards();
loadSwitches();
loadProposals();

const savedTab = localStorage.getItem('tierlist_tab') || 'home';
showTab(savedTab);

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
    refreshAdminBar();
    loadStats();
  }
});
</script>
