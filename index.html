<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог Периферии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F9FA;
    --surface: #FFFFFF;
    --surface-2: #F0F2F5;
    --border: #E5E7EB;
    --text: #111827;
    --text-muted: #6B7280;
    --accent: #0052FF;
    --accent-hover: #0043D1;
    --accent-text: #FFFFFF;
    --link: #0052FF;
    --danger: #EF4444;
    --pending: #F59E0B;
    --input-bg: #FFFFFF;
    --glass-bg: rgba(255, 255, 255, 0.8);
    --glass-border: rgba(255, 255, 255, 0.3);
  }

  * { box-sizing: border-box; }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 60px 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { 
    font-weight: 700; 
    letter-spacing: -0.02em;
    margin: 0;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Glassmorphism Header */
  #admin-bar {
    position: sticky;
    top: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    font-size: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    z-index: 50;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }

  #admin-bar input {
    padding: 8px 16px;
    background: var(--surface-2);
    border: 1px solid transparent;
    color: var(--text);
    border-radius: 99px;
    transition: all 0.2s;
    outline: none;
  }
  
  #admin-bar input:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.1);
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }

  #admin-bar button {
    padding: 8px 16px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }

  #admin-bar button:hover {
    background: var(--surface-2);
  }

  #admin-bar .primary-btn { 
    background: var(--accent); 
    border-color: var(--accent); 
    color: var(--accent-text); 
  }
  
  #admin-bar .primary-btn:hover {
    background: var(--accent-hover);
  }

  .header-content {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .header-content h1 { font-size: 40px; }
  .header-content .sub { font-size: 16px; color: var(--text-muted); margin-top: 8px; }

  /* Minimalist Pills Navigation */
  .tabs { 
    display: flex; 
    gap: 12px; 
    flex-wrap: wrap; 
    margin-bottom: 32px; 
  }
  
  .tabs button {
    padding: 10px 24px; 
    cursor: pointer; 
    background: var(--surface); 
    color: var(--text-muted);
    border: 1px solid var(--border); 
    border-radius: 99px; 
    font-size: 15px;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.01);
  }

  .tabs button:hover {
    color: var(--text);
    border-color: #D1D5DB;
  }

  .tabs button.active { 
    background: var(--text); 
    border-color: var(--text); 
    color: var(--surface); 
    font-weight: 500; 
  }

  .tab-content { display: none; animation: fadeIn 0.3s ease; }
  .tab-content.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Spacious Grid & Premium Cards */
  .card-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
    gap: 24px; 
  }

  .card { 
    background: var(--surface); 
    border: 1px solid var(--border); 
    border-radius: 20px; 
    padding: 24px; 
    cursor: pointer; 
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    /* Soft premium shadow reflecting a studio podium lighting setup */
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0,0,0,0.02);
  }

  .card:hover { 
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 32px rgba(0, 82, 255, 0.08), 0 4px 12px rgba(0,0,0,0.02);
  }

  .card-image {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, #ffffff 0%, #f0f2f5 100%);
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9CA3AF;
    font-size: 14px;
    box-shadow: inset 0 -2px 10px rgba(0,0,0,0.01);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .card .tier { 
    background: var(--text);
    color: var(--surface);
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 700; 
    font-size: 14px; 
  }

  .card .name { 
    font-size: 20px; 
    font-weight: 600; 
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .card .price {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .card .detail { 
    font-size: 14px; 
    color: var(--text-muted); 
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }

  /* List View Table */
  .table-wrap { 
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
  }
  
  .table-wrap table { 
    width: 100%; 
    border-collapse: collapse; 
    font-size: 14px; 
  }
  
  .table-wrap th { 
    background: var(--surface-2); 
    font-weight: 600;
    color: var(--text-muted);
    padding: 16px;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  
  .table-wrap td { 
    padding: 16px; 
    border-bottom: 1px solid var(--border);
  }
  
  .table-wrap tbody tr { 
    transition: background 0.2s;
    cursor: pointer;
  }
  
  .table-wrap tbody tr:hover { 
    background: var(--surface-2); 
  }
  
  .table-wrap tbody tr:last-child td {
    border-bottom: none;
  }

  .view-toggle { 
    display: flex; 
    gap: 4px; 
    background: var(--surface); 
    border-radius: 99px; 
    padding: 4px; 
    border: 1px solid var(--border); 
  }
  
  .view-toggle button { 
    background: transparent; 
    border: none; 
    color: var(--text-muted); 
    padding: 8px 16px; 
    border-radius: 99px; 
    cursor: pointer; 
    font-size: 14px; 
    transition: all 0.2s;
  }
  
  .view-toggle button.active { 
    background: var(--surface-2); 
    color: var(--text); 
    font-weight: 500;
  }

  /* Forms */
  form { 
    background: var(--surface); 
    padding: 32px; 
    border-radius: 20px; 
    border: 1px solid var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.02);
    max-width: 800px;
  }
  
  form label { 
    display: block; 
    margin-top: 16px; 
    font-size: 14px; 
    font-weight: 500;
    color: var(--text); 
  }
  
  form input, form textarea, form select {
    width: 100%; 
    padding: 12px 16px; 
    margin-top: 8px; 
    background: var(--surface-2); 
    color: var(--text);
    border: 1px solid transparent; 
    border-radius: 12px; 
    font-family: inherit;
    font-size: 15px;
    transition: all 0.2s;
  }
  
  form input:focus, form textarea:focus, form select:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(0, 82, 255, 0.1);
    outline: none;
  }

  form button { 
    margin-top: 24px; 
    padding: 12px 28px; 
    background: var(--accent); 
    color: var(--accent-text); 
    border: none; 
    border-radius: 99px; 
    cursor: pointer; 
    font-size: 15px;
    font-weight: 600; 
    transition: background 0.2s;
  }

  form button:hover {
    background: var(--accent-hover);
  }
  
  .flex { display: flex; gap: 20px; flex-wrap: wrap; }
  .flex label { flex: 1; min-width: 200px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(17, 24, 39, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100; align-items: center; justify-content: center; padding: 40px 16px; overflow-y: auto;
  }
  
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
  
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    max-width: 720px; width: 100%; padding: 40px; position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  }
  
  .modal-close {
    position: absolute; top: 24px; right: 24px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface-2); border: none; color: var(--text-muted);
    cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .modal-close:hover {
    background: #E5E7EB;
    color: var(--text);
  }

  .detail-badge {
    padding: 6px 16px; border-radius: 12px; background: var(--text); color: var(--surface);
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
    margin-bottom: 16px;
  }

  .detail-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .detail-subtitle { font-size: 16px; color: var(--text-muted); margin-top: 8px; }
  .detail-price { font-size: 28px; font-weight: 700; color: var(--accent); margin-top: 16px; }
  
  .detail-stats { 
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 24px; 
    margin: 32px 0; padding: 24px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); 
  }
  
  .detail-stat .label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; font-weight: 600; }
  .detail-stat .value { font-size: 16px; font-weight: 500; margin-top: 4px; color: var(--text); }
  
  .detail-buy { 
    display: flex; align-items: center; justify-content: center; width: 100%;
    margin: 32px 0 0; padding: 16px; background: var(--accent); color: var(--accent-text); 
    border-radius: 16px; text-decoration: none; font-weight: 600; font-size: 16px;
    transition: background 0.2s;
  }

  .detail-buy:hover {
    background: var(--accent-hover);
  }
</style>
</head>
<body>

<div id="admin-bar"></div>

<div class="container">
  <div class="header-content">
    <div>
      <h1>Каталог Периферии</h1>
      <p class="sub">Премиальный рейтинг клавиатур и мышей от сообщества</p>
    </div>
    <div class="view-toggle" id="view-toggle">
      <button id="view-grid" class="active" onclick="setView('grid')">Сетка</button>
      <button id="view-list" onclick="setView('list')">Список</button>
    </div>
  </div>

  <div class="tabs">
    <button id="tab-btn-home" class="active" onclick="showTab('home')">Обзор</button>
    <button id="tab-btn-keyboards" onclick="showTab('keyboards')">Клавиатуры</button>
    <button id="tab-btn-switches" onclick="showTab('switches')">Мыши / Свитчи</button>
    <button id="tab-btn-proposals" onclick="showTab('proposals')">Предложения</button>
    <button id="tab-btn-new" onclick="showTab('new')">Добавить девайс</button>
  </div>

  <!-- КЛАВИАТУРЫ -->
  <div id="tab-keyboards" class="tab-content active">
    <div id="keyboards-container"><p class="small">Загрузка данных...</p></div>
  </div>

  <!-- МЫШИ/СВИТЧИ -->
  <div id="tab-switches" class="tab-content">
    <div id="switches-container"><p class="small">Загрузка данных...</p></div>
  </div>

  <!-- ПРЕДЛОЖЕНИЯ -->
  <div id="tab-proposals" class="tab-content">
    <div id="proposals-list"><p class="small">Загрузка...</p></div>
  </div>

  <!-- ПРЕДЛОЖИТЬ -->
  <div id="tab-new" class="tab-content">
    <div class="tabs" style="margin-bottom:24px;">
      <button id="new-subtab-btn-keyboard" class="active" onclick="showNewSubtab('keyboard')">Клавиатура</button>
      <button id="new-subtab-btn-switch" onclick="showNewSubtab('switch')">Мышь / Свитч</button>
    </div>

    <form id="proposal-form-keyboard">
      <label>Тип действия
        <select id="kb-type">
          <option value="add">Добавить новое устройство</option>
          <option value="edit">Обновить информацию</option>
        </select>
      </label>
      <div id="kb-edit-target-wrap" style="display:none">
        <label>Выберите устройство <select id="kb-target"></select></label>
      </div>
      <div id="kb-name-wrap" class="flex">
        <!-- Адаптированные плейсхолдеры под современные девайсы -->
        <label>Название модели <input id="kb-name" placeholder="например, Epomaker HE80"></label>
      </div>
      <div class="flex">
        <div id="kb-format-wrap" style="flex:1; min-width:200px;">
          <label>Форм-фактор <input id="kb-format" placeholder="75%, TKL, 60%..."></label>
        </div>
        <label>Рейтинг (Tier) <input id="kb-tier" placeholder="S, A, B..."></label>
      </div>
      <div class="flex">
        <label>Примерная цена <input id="kb-price" placeholder="$150"></label>
        <label>Ссылка на магазин <input id="kb-buy" placeholder="https://..."></label>
      </div>
      <div class="flex">
        <label>Тип переключателей <input id="kb-switches" placeholder="Магнитные, Линейные..."></label>
        <label>ПО <input id="kb-software" placeholder="Название софта"></label>
      </div>
      <label>Комментарий <textarea id="kb-reason" rows="3" placeholder="Опишите особенности сборки, звучания..."></textarea></label>
      <div class="flex">
        <button type="submit">Отправить на модерацию</button>
        <button type="button" onclick="resetForm('keyboard')" style="background:var(--surface-2); color:var(--text); border:none;">Очистить форму</button>
      </div>
    </form>
    
    <form id="proposal-form-switch" style="display:none">
      <label>Тип действия
        <select id="sw-type">
          <option value="add">Добавить новую мышь/свитч</option>
          <option value="edit">Обновить информацию</option>
        </select>
      </label>
      <div id="sw-name-wrap" class="flex">
        <label>Название модели <input id="sw-name" placeholder="например, ATK F1 Extreme"></label>
      </div>
      <div class="flex">
        <label>Рейтинг (Tier) <input id="sw-tier" placeholder="S, A, B..."></label>
        <label>Примерная цена <input id="sw-price" placeholder="$90"></label>
      </div>
      <label>Особенности сенсора/микриков <textarea id="sw-reason" rows="3" placeholder="Опишите сенсор, вес, покрытие..."></textarea></label>
      <div class="flex">
        <button type="submit">Отправить на модерацию</button>
      </div>
    </form>
  </div>
</div>

<!-- Модальное окно устройства -->
<div id="detail-modal" class="modal-overlay" onclick="if(event.target===this) closeDetailModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    <div id="detail-modal-content">Загрузка...</div>
  </div>
</div>

<script>
// Mock data and visual logic setup to reflect the new UI structure
let currentView = 'grid';

function setView(view) {
  currentView = view;
  document.getElementById('view-grid').classList.toggle('active', view === 'grid');
  document.getElementById('view-list').classList.toggle('active', view === 'list');
  // Re-render logic would go here
  renderMockData();
}

function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabs > button').forEach(el => el.classList.remove('active'));
  
  const tab = document.getElementById('tab-' + name);
  if (tab) tab.classList.add('active');
  const btn = document.getElementById('tab-btn-' + name);
  if (btn) btn.classList.add('active');
}

function showNewSubtab(cat) {
  document.getElementById('proposal-form-keyboard').style.display = cat === 'keyboard' ? 'block' : 'none';
  document.getElementById('proposal-form-switch').style.display = cat === 'switch' ? 'block' : 'none';
  document.getElementById('new-subtab-btn-keyboard').classList.toggle('active', cat === 'keyboard');
  document.getElementById('new-subtab-btn-switch').classList.toggle('active', cat === 'switch');
}

function renderMockData() {
  const container = document.getElementById('keyboards-container');
  const items = [
    { name: 'Epomaker HE80', tier: 'S', price: '$130', format: '75%', switches: 'Магнитные' },
    { name: 'Wooting 60HE', tier: 'S+', price: '$175', format: '60%', switches: 'Lekker' }
  ];

  if (currentView === 'grid') {
    container.innerHTML = `<div class="card-grid">${items.map(d => `
      <div class="card" onclick="openDetailModal()">
        <div class="card-image">Фото устройства</div>
        <div class="card-header">
          <div class="tier">${d.tier}</div>
        </div>
        <div class="name">${d.name}</div>
        <div class="detail"><span>Формат</span> <span>${d.format}</span></div>
        <div class="detail"><span>Свитчи</span> <span>${d.switches}</span></div>
        <div class="price">${d.price}</div>
      </div>
    `).join('')}</div>`;
  } else {
    container.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Рейтинг</th><th>Модель</th><th>Формат</th><th>Цена</th></tr></thead>
      <tbody>${items.map(d => `<tr><td><b>${d.tier}</b></td><td>${d.name}</td><td>${d.format}</td><td style="color:var(--accent); font-weight:600;">${d.price}</td></tr>`).join('')}</tbody>
    </table></div>`;
  }
}

function openDetailModal() {
  document.getElementById('detail-modal-content').innerHTML = `
    <div class="detail-badge">S</div>
    <div class="detail-title">Epomaker HE80</div>
    <div class="detail-subtitle">Магнитная клавиатура · 75%</div>
    
    <div class="detail-stats">
      <div class="detail-stat"><div class="label">Свитчи</div><div class="value">Магнитные</div></div>
      <div class="detail-stat"><div class="label">Формат</div><div class="value">75%</div></div>
      <div class="detail-stat"><div class="label">Цена</div><div class="value" style="color:var(--accent); font-size:20px; font-weight:700;">$130</div></div>
    </div>
    
    <a href="#" class="detail-buy">Проверить цену</a>
  `;
  document.getElementById('detail-modal').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detail-modal').classList.remove('open');
}

// Initial render
renderMockData();
</script>
</body>
</html>
