<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Tierlist — Рейтинг девайсов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { accent: '#2563EB', accent2: '#0D9488' }
      }
    }
  }
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-[#F4F4F6] text-[#111827]">

<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// Инициализация Supabase с безопасной проверкой глобальных переменных
const SUPABASE_URL_VAL = typeof window.SUPABASE_URL !== 'undefined' ? window.SUPABASE_URL : (typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : '');
const SUPABASE_ANON_KEY_VAL = typeof window.SUPABASE_ANON_KEY !== 'undefined' ? window.SUPABASE_ANON_KEY : (typeof SUPABASE_ANON_KEY !== 'undefined' ? SUPABASE_ANON_KEY : '');
const sb = supabase.createClient(SUPABASE_URL_VAL, SUPABASE_ANON_KEY_VAL);

// ============================================================
// ИКОНКИ
// ============================================================
const Icon = ({ d, className = "w-4 h-4", strokeWidth = 2 }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth}
       strokeLinecap="round" strokeLinejoin="round" className={className}>
    <path d={d} />
  </svg>
);
const ICONS = {
  search: "M21 21l-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z",
  grid: "M3 3h7v7H3V3Zm11 0h7v7h-7V3ZM3 14h7v7H3v-7Zm11 0h7v7h-7v-7Z",
  list: "M4 6h16M4 12h16M4 18h16",
  x: "M18 6L6 18M6 6l12 12",
  star: "M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2Z",
  cart: "M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 4.6A1 1 0 0 0 5.6 19H17M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z",
  arrowRight: "M5 12h14M13 6l6 6-6 6",
  keyboard: "M4 6h16v12H4V6Zm3 4h.01M11 10h.01M15 10h.01M7 14h10",
};

// ============================================================
// ТИРЫ
// ============================================================
const TIER_ORDER = ['SS+', 'SS', 'S+', 'S', 'A+', 'A', 'B', 'C', 'D', 'F'];
const TIER_STYLES = {
  'SS+': 'bg-amber-50 text-amber-700 border-amber-200',
  'SS':  'bg-yellow-50 text-yellow-700 border-yellow-200',
  'S+':  'bg-emerald-50 text-emerald-700 border-emerald-200',
  'S':   'bg-teal-50 text-teal-700 border-teal-200',
  'A+':  'bg-blue-50 text-blue-700 border-blue-200',
  'A':   'bg-sky-50 text-sky-700 border-sky-200',
  'B':   'bg-slate-100 text-slate-600 border-slate-200',
  'C':   'bg-gray-100 text-gray-500 border-gray-200',
  'D':   'bg-orange-50 text-orange-600 border-orange-200',
  'F':   'bg-red-50 text-red-600 border-red-200',
};
function tierStyle(tier) {
  const key = (tier || '').split(/[\s\-]+/)[0];
  return TIER_STYLES[key] || 'bg-gray-100 text-gray-500 border-gray-200';
}
function mainTier(tier) { return (tier || '').split(/[\s\-]+/)[0]; }
function sortByTier(items) {
  return [...items].sort((a, b) => {
    const ia = TIER_ORDER.indexOf(mainTier(a.tier));
    const ib = TIER_ORDER.indexOf(mainTier(b.tier));
    if (ia === -1 && ib === -1) return 0;
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

// ============================================================
// УТИЛИТЫ
// ============================================================
function linkify(text) {
  if (!text) return text;
  const parts = text.split(/(https?:\/\/[^\s]+)/g);
  return parts.map((p, i) => /^https?:\/\//.test(p)
    ? <a key={i} href={p} target="_blank" rel="noopener noreferrer" className="text-accent underline">{p}</a>
    : p);
}
const KNOWN_LINKS = {
  'ozon': 'https://www.ozon.ru', 'aliexpress': 'https://aliexpress.com',
  'taobao': 'https://www.taobao.com', 'avito': 'https://www.avito.ru',
  'авито': 'https://www.avito.ru', 'dns': 'https://www.dns-shop.ru',
  'vgn hub': 'https://vgn.gg', 'wootility': 'https://wootility.io',
  'atk': 'https://www.atkgear.com', 'mchose hub': 'https://mchose.com',
};
function resolveBuyUrl(text) {
  if (!text) return null;
  if (/^https?:\/\//.test(text)) return text;
  return KNOWN_LINKS[text.trim().toLowerCase()] || null;
}
function siteLabel(text) {
  if (!text) return 'магазине';
  if (/^https?:\/\//.test(text)) {
    try { return new URL(text).hostname.replace('www.', ''); } catch (e) { return 'магазине'; }
  }
  return text;
}
function getVoterId() {
  let id = localStorage.getItem('voter_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('voter_id', id); }
  return id;
}
function parsePrice(str) {
  if (!str) return null;
  const digits = String(str).replace(/[^\d]/g, '');
  return digits ? parseInt(digits, 10) : null;
}

// ============================================================
// МЕЛКИЕ UI-ПРИМИТИВЫ
// ============================================================
function Pill({ active, onClick, children }) {
  return (
    <button onClick={onClick}
      className={`px-3.5 py-1.5 rounded-full text-sm font-medium border transition
        ${active ? 'bg-accent text-white border-accent' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-300'}`}>
      {children}
    </button>
  );
}
function TierBadge({ tier, size = 'md' }) {
  const sizeCls = size === 'lg' ? 'text-sm px-3 py-1' : 'text-xs px-2 py-0.5';
  return <span className={`inline-flex items-center rounded-full border font-bold ${sizeCls} ${tierStyle(tier)}`}>{tier || '—'}</span>;
}
function Spec({ label, value }) {
  if (!value) return null;
  return (
    <span className="inline-flex items-center gap-1 text-xs bg-gray-100 text-gray-600 rounded-full px-2.5 py-1">
      <span className="text-gray-400">{label}:</span> {value}
    </span>
  );
}
function Stars({ rating, onRate, size = 'text-xl' }) {
  return (
    <div className={`flex gap-0.5 ${size}`}>
      {[1,2,3,4,5].map(n => (
        <span key={n} onClick={() => onRate && onRate(n)}
          className={`${onRate ? 'cursor-pointer' : ''} ${n <= rating ? 'text-amber-400' : 'text-gray-200'}`}>★</span>
      ))}
    </div>
  );
}

// ============================================================
// МОДАЛКА-КАРКАС
// ============================================================
function Modal({ open, onClose, children, maxWidth = 'max-w-xl' }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-start justify-center overflow-y-auto p-4 sm:p-8"
         onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`bg-white rounded-2xl shadow-xl w-full ${maxWidth} p-6 relative my-4`}>
        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center">
          <Icon d={ICONS.x} className="w-4 h-4 text-gray-500" />
        </button>
        {children}
      </div>
    </div>
  );
}

// ============================================================
// ШАПКА
// ============================================================
function Header({ tab, setTab, search, setSearch, user, isAdmin, onLogout, onOpenAuth }) {
  const searchRef = useRef(null);
  useEffect(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
